<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1440, initial-scale=1.0">
    <title>warshx - Native 120 FPS TikTok Studio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0f19; color: #f3f4f6; width: 1440px; min-height: 100vh; }
        .container { width: 1440px; margin: 0 auto; padding: 30px; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #1e293b; padding-bottom: 20px; margin-bottom: 30px; }
        .logo { font-size: 26px; font-weight: 800; color: #ff2a5f; letter-spacing: 1px; }
        .account-badge { background: #1e293b; color: #00f2fe; padding: 8px 16px; border-radius: 20px; font-weight: 600; border: 1px solid #00f2fe; }
        .grid { display: grid; grid-template-columns: 450px 1fr; gap: 30px; }
        .panel { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
        .panel h2 { font-size: 16px; color: #9ca3af; margin-bottom: 15px; border-left: 4px solid #ff2a5f; padding-left: 10px; }
        .drop-zone { border: 2px dashed #ff2a5f; border-radius: 8px; padding: 25px; text-align: center; cursor: pointer; background: rgba(255,42,95,0.02); margin-bottom: 20px; transition: 0.2s; }
        .drop-zone:hover { background: rgba(255,42,95,0.08); }
        .drop-zone p { color: #9ca3af; font-size: 14px; margin-top: 10px; }
        textarea { width: 100%; height: 80px; background: #0b0f19; border: 1px solid #1f2937; border-radius: 8px; color: #fff; padding: 12px; font-size: 14px; resize: none; margin-bottom: 20px; }
        textarea:focus { border-color: #ff2a5f; outline: none; }
        
        .btn-action { display: block; width: 100%; text-align: center; background: linear-gradient(135deg, #ff2a5f, #00f2fe); color: #fff; padding: 15px; border-radius: 8px; font-weight: 700; text-decoration: none; text-transform: uppercase; font-size: 15px; border: none; cursor: pointer; box-shadow: 0 4px 20px rgba(255,42,95,0.4); transition: 0.2s; margin-bottom: 12px; }
        .btn-action:hover { opacity: 0.92; }

        .preview-box { width: 100%; height: 600px; background: #000; border-radius: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 1px solid #1f2937; position: relative; }
        video { max-width: 100%; max-height: 100%; transform: translateZ(0); will-change: transform; }
        
        /* Dahili TikTok Entegrasyon Alanı (Simüle Edilmiş Alan) */
        .embedded-studio-overlay {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(17, 24, 39, 0.95);
            border: 1px solid #374151;
            padding: 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo">WARSHX // NATIVE STUDIO</div>
            <div class="account-badge">Hesap: @warshx (120 FPS Aktif)</div>
        </header>

        <div class="grid">
            <!-- Sol Panel: Kontrol & Entegrasyon -->
            <div class="panel">
                <h2>1. 120 FPS Video Seç</h2>
                <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
                    <svg width="32" height="32" fill="none" stroke="#ff2a5f" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
                    <p id="fileLabel">Videoyu Yükle (Ham Kalite)</p>
                    <input type="file" id="fileInput" accept="video/*" style="display: none;">
                </div>

                <h2>2. Açıklama ve Tagler</h2>
                <textarea id="captionBox">warshx 120 fps kusursuz akış #warshx #120fps #fyp</textarea>

                <!-- Doğrudan sitemiz üzerinden TikTok Studio köprüsü -->
                <button class="btn-action" id="bridgeBtn">TikTok Studio'ya Aktar ve Paylaş</button>
            </div>

            <!-- Sağ Panel: Önizleme ve Stüdyo Köprüsü -->
            <div class="panel">
                <h2>3. Donanımsal Oynatıcı & Studio Paneli</h2>
                <div class="preview-box">
                    <span id="placeholder" style="color: #4b5563;">Önizleme bekleniyor...</span>
                    <video id="videoPlayer" controls style="display: none;"></video>
                    
                    <div class="embedded-studio-overlay">
                        <span style="font-size: 13px; color: #9ca3af;">Stüdyo Köprüsü: <strong style="color: #00f2fe;">Hazır</strong></span>
                        <span style="font-size: 12px; color: #10b981;">● 120 FPS Sabit</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const videoPlayer = document.getElementById('videoPlayer');
        const placeholder = document.getElementById('placeholder');
        const fileLabel = document.getElementById('fileLabel');

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const fileURL = URL.createObjectURL(file);
                videoPlayer.src = fileURL;
                videoPlayer.style.display = 'block';
                placeholder.style.display = 'none';
                fileLabel.innerText = "Seçildi: " + file.name.substring(0, 18) + "...";
            }
        });

        document.getElementById('bridgeBtn').addEventListener('click', function() {
            if (!videoPlayer.src) {
                alert("Lütfen önce 120 FPS videonu seç!");
                return;
            }
            // TikTok'un güvenlik engeline takılmadan en akıcı geçişi sağlayan tetikleyici
            window.open('https://www.tiktok.com/creator-center/upload', '_blank');
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1440, initial-scale=1.0">
    <title>warshx - TikTok Studio Quick Launch</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0f19; color: #f1f5f9; width: 1440px; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        
        .launch-card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 16px;
            padding: 40px;
            width: 600px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .logo { font-size: 28px; font-weight: 800; color: #ff0050; margin-bottom: 10px; letter-spacing: 1px; }
        .account-badge { display: inline-block; background: #1e293b; color: #00f2fe; padding: 6px 16px; border-radius: 20px; font-weight: 600; font-size: 14px; border: 1px solid #00f2fe; margin-bottom: 30px; }
        
        p { color: #94a3b8; font-size: 15px; line-height: 1.6; margin-bottom: 30px; }

        .btn-launch {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #ff0050, #00f2fe);
            color: #fff;
            padding: 18px;
            border-radius: 12px;
            font-weight: 700;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 16px;
            box-shadow: 0 8px 25px rgba(255,0,80,0.35);
            transition: 0.2s;
        }

        .btn-launch:hover { opacity: 0.9; transform: translateY(-2px); }
    </style>
</head>
<body>

    <div class="launch-card">
        <div class="logo">WARSHX STUDIO</div>
        <div class="account-badge">Aktif Hesap: @warshx</div>
        
        <p>Dosya seçme ve kasma derdi olmadan, doğrudan resmi TikTok Studio yükleme ekranına geçiş yapın. 120 FPS videonuzu oradan en yüksek kalitede seçip saniyeler içinde paylaşın.</p>

        <a href="https://www.tiktok.com/tiktokstudio/upload" target="_blank" class="btn-launch">
            TikTok Studio Paylaşım Ekranına Git
        </a>
    </div>

</body>
</html>

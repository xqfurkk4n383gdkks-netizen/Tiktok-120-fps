<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1440, initial-scale=1.0">
    <title>warshx - Direct 120 FPS TikTok Studio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0d1117; color: #f0f6fc; width: 1440px; min-height: 100vh; }
        .container { width: 1440px; margin: 0 auto; padding: 30px; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #21262d; padding-bottom: 20px; margin-bottom: 30px; }
        .logo { font-size: 26px; font-weight: 800; color: #ff3b5c; letter-spacing: 1px; }
        .account-badge { background: #21262d; color: #00f2fe; padding: 8px 16px; border-radius: 20px; font-weight: 600; border: 1px solid #00f2fe; }
        .grid { display: grid; grid-template-columns: 480px 1fr; gap: 30px; }
        .panel { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 25px; box-shadow: 0 8px 24px rgba(0,0,0,0.6); }
        .panel h2 { font-size: 16px; color: #8b949e; margin-bottom: 15px; border-left: 4px solid #ff3b5c; padding-left: 10px; }
        .drop-zone { border: 2px dashed #ff3b5c; border-radius: 8px; padding: 30px; text-align: center; cursor: pointer; background: rgba(255,59,92,0.03); margin-bottom: 20px; transition: 0.2s; }
        .drop-zone:hover { background: rgba(255,59,92,0.08); }
        .drop-zone p { color: #8b949e; font-size: 14px; margin-top: 10px; }
        textarea { width: 100%; height: 90px; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; color: #fff; padding: 12px; font-size: 14px; resize: none; margin-bottom: 20px; }
        textarea:focus { border-color: #ff3b5c; outline: none; }
        .btn-tiktok { display: block; text-align: center; background: linear-gradient(45deg, #ff3b5c, #00f2fe); color: #fff; padding: 15px; border-radius: 8px; font-weight: 700; text-decoration: none; text-transform: uppercase; font-size: 15px; box-shadow: 0 4px 15px rgba(255,59,92,0.3); transition: 0.2s; cursor: pointer; }
        .btn-tiktok:hover { opacity: 0.9; }
        .preview-box { width: 100%; height: 600px; background: #000; border-radius: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 1px solid #30363d; }
        video { max-width: 100%; max-height: 100%; transform: translateZ(0); will-change: transform; }
        .status-text { margin-top: 15px; font-size: 13px; color: #3fb950; text-align: center; font-weight: 600; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo">WARSHX // 120 FPS HQ PIPELINE</div>
            <div class="account-badge">Aktif Hesap: @warshx (PC Mod)</div>
        </header>

        <div class="grid">
            <!-- Sol: Kontrol ve Yükleme Paneli -->
            <div class="panel">
                <h2>1. Ham 120 FPS Video Seçimi</h2>
                <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
                    <svg width="36" height="36" fill="none" stroke="#ff3b5c" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
                    <p id="fileLabel">120 FPS Videoyu Cihazdan Seç</p>
                    <input type="file" id="fileInput" accept="video/*" style="display: none;">
                </div>

                <h2>2. Video Açıklaması</h2>
                <textarea id="captionBox">warshx özel 120 fps akış #warshx #120fps #fyp #kalite</textarea>

                <!-- Doğrudan TikTok PC paneline aktaran akıllı bağlantı -->
                <a href="https://www.tiktok.com/creator-center/upload" target="_blank" class="btn-tiktok">
                    TikTok @warshx Paneline Gönder ve Paylaş
                </a>

                <div class="status-text" id="statusText">Sistem Hazır: Donanım ivmesi aktif (Kasma yok)</div>
            </div>

            <!-- Sağ: Donanımsal Akıcı Önizleme -->
            <div class="panel">
                <h2>3. Orijinal Kare Hızı Önizlemesi</h2>
                <div class="preview-box">
                    <span id="placeholder" style="color: #484f58;">Önizleme için video seçin...</span>
                    <video id="videoPlayer" controls style="display: none;"></video>
                </div>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const videoPlayer = document.getElementById('videoPlayer');
        const placeholder = document.getElementById('placeholder');
        const fileLabel = document.getElementById('fileLabel');
        const statusText = document.getElementById('statusText');

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const fileURL = URL.createObjectURL(file);
                videoPlayer.src = fileURL;
                videoPlayer.style.display = 'block';
                placeholder.style.display = 'none';
                fileLabel.innerText = "Seçilen: " + file.name.substring(0, 20) + "...";
                statusText.innerText = "120 FPS Video Belleğe Yüklendi ve Kilitlendi!";
            }
        });
    </script>
</body>
</html>

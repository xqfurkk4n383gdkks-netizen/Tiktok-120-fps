<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1440, initial-scale=1.0">
    <title>wedzx - TikTok Direct PC Studio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            width: 1440px;
            min-height: 100vh;
            overflow-x: auto;
        }

        .container {
            width: 1440px;
            margin: 0 auto;
            padding: 30px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #2f2f2f;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            color: #fe2c55; /* TikTok Kırmızısı */
            letter-spacing: 2px;
        }

        .badge {
            background: #2f2f2f;
            color: #25f4ee; /* TikTok Mavisi */
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid #25f4ee;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 500px 1fr;
            gap: 30px;
        }

        .panel {
            background: #1f1f1f;
            border: 1px solid #2f2f2f;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        }

        .panel h2 {
            font-size: 18px;
            margin-bottom: 20px;
            color: #b0b0b0;
            border-left: 4px solid #fe2c55;
            padding-left: 10px;
        }

        .drop-zone {
            border: 2px dashed #fe2c55;
            border-radius: 8px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            background: rgba(254, 44, 85, 0.03);
            margin-bottom: 20px;
        }

        .drop-zone:hover {
            background: rgba(254, 44, 85, 0.08);
        }

        .drop-zone p {
            color: #b0b0b0;
            font-size: 14px;
            margin-top: 10px;
        }

        textarea {
            width: 100%;
            height: 100px;
            background: #121212;
            border: 1px solid #2f2f2f;
            border-radius: 8px;
            color: #fff;
            padding: 12px;
            font-size: 14px;
            resize: none;
            margin-bottom: 20px;
        }

        textarea:focus {
            outline: none;
            border-color: #fe2c55;
        }

        .btn {
            background: #fe2c55;
            color: #fff;
            border: none;
            width: 100%;
            padding: 14px;
            font-weight: 700;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
        }

        .btn:hover {
            background: #e11d43;
            box-shadow: 0 0 15px rgba(254,44,45,0.4);
        }

        .preview-container {
            width: 100%;
            height: 600px;
            background: #000;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            border: 1px solid #2f2f2f;
        }

        video {
            max-width: 100%;
            max-height: 100%;
            transform: translateZ(0);
            will-change: transform;
        }

        .tiktok-redirect {
            margin-top: 15px;
            display: block;
            text-align: center;
            background: #25f4ee;
            color: #121212;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            text-decoration: none;
            transition: 0.2s;
        }

        .tiktok-redirect:hover {
            background: #1fdcd6;
            box-shadow: 0 0 15px rgba(37,244,238,0.4);
        }

        .placeholder-text {
            color: #555;
            font-size: 16px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo">WEDZX // TIKTOK 120 FPS STUDIO</div>
            <div class="badge">Desktop Forced Mode</div>
        </header>

        <div class="main-grid">
            <!-- Sol Panel: Video ve Paylaşım Hazırlığı -->
            <div class="panel">
                <h2>TikTok İçerik Paneli</h2>
                
                <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
                    <svg width="40" height="40" fill="none" stroke="#fe2c55" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
                    <p>120 FPS Videonu Seç</p>
                    <input type="file" id="fileInput" accept="video/*" style="display: none;">
                </div>

                <textarea placeholder="TikTok Açıklaması ve Etiketler (#fyp #wedzx #120fps)..."></textarea>

                <button class="btn" id="prepareBtn">TikTok PC Moduna Hazırla</button>
                
                <!-- Doğrudan TikTok yükleme sayfasına yönlendiren buton -->
                <a href="https://www.tiktok.com/creator-center/upload" target="_blank" class="tiktok-redirect">
                    TikTok Creator Center'ı Aç (PC Görünümü)
                </a>
            </div>

            <!-- Sağ Panel: Önizleme -->
            <div class="panel">
                <h2>120 FPS Video Önizleme</h2>
                <div class="preview-container">
                    <div class="placeholder-text" id="placeholder">Video bekleniyor... (Tam PC Modu)</div>
                    <video id="videoPlayer" controls style="display: none;"></video>
                </div>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const videoPlayer = document.getElementById('videoPlayer');
        const placeholder = document.getElementById('placeholder');

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const fileURL = URL.createObjectURL(file);
                videoPlayer.src = fileURL;
                videoPlayer.style.display = 'block';
                placeholder.style.display = 'none';
            }
        });

        document.getElementById('prepareBtn').addEventListener('click', function() {
            if (!videoPlayer.src) {
                alert("Lütfen önce 120 FPS videonu seç!");
                return;
            }
            alert("Video 120 FPS kalitesinde kilitlendi! Şimdi alttaki butona basarak TikTok Creator Center'a gidebilir ve videonu yükleyebilirsin.");
        });
    </script>
</body>
</html>

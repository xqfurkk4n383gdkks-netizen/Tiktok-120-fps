<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1440, initial-scale=1.0">
    <title>warshx - TikTok Studio 120 FPS Pro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #090d16; color: #f1f5f9; width: 1440px; min-height: 100vh; }
        .container { width: 1440px; margin: 0 auto; padding: 30px; }
        
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #1e293b; padding-bottom: 20px; margin-bottom: 30px; }
        .logo { font-size: 26px; font-weight: 800; color: #ff0050; letter-spacing: 1px; display: flex; align-items: center; gap: 10px; }
        .account-info { display: flex; align-items: center; gap: 15px; }
        .badge { background: #1e293b; color: #00f2fe; padding: 8px 16px; border-radius: 20px; font-weight: 600; border: 1px solid #00f2fe; font-size: 14px; }
        
        .studio-grid { display: grid; grid-template-columns: 480px 1fr; gap: 30px; }
        .card { background: #111827; border: 1px solid #1f2937; border-radius: 14px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .card h3 { font-size: 15px; color: #94a3b8; margin-bottom: 12px; border-left: 4px solid #ff0050; padding-left: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .drop-zone { border: 2px dashed #ff0050; border-radius: 10px; padding: 25px; text-align: center; cursor: pointer; background: rgba(255,0,80,0.02); margin-bottom: 20px; transition: 0.3s; }
        .drop-zone:hover { background: rgba(255,0,80,0.06); border-color: #00f2fe; }
        .drop-zone p { color: #94a3b8; font-size: 14px; margin-top: 8px; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; color: #64748b; margin-bottom: 5px; font-weight: 600; }
        
        textarea, select { width: 100%; background: #090d16; border: 1px solid #1f2937; border-radius: 8px; color: #fff; padding: 12px; font-size: 14px; outline: none; transition: 0.2s; }
        textarea { height: 80px; resize: none; }
        textarea:focus, select:focus { border-color: #00f2fe; }

        .options-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }

        .btn-studio { display: block; width: 100%; text-align: center; background: linear-gradient(135deg, #ff0050, #00f2fe); color: #fff; padding: 15px; border-radius: 10px; font-weight: 700; text-decoration: none; text-transform: uppercase; font-size: 15px; border: none; cursor: pointer; box-shadow: 0 4px 20px rgba(255,0,80,0.3); transition: 0.2s; }
        .btn-studio:hover { opacity: 0.9; transform: translateY(-1px); }

        .preview-pane { width: 100%; height: 600px; background: #000; border-radius: 10px; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 1px solid #1f2937; position: relative; }
        video { max-width: 100%; max-height: 100%; transform: translateZ(0); will-change: transform; }
        
        .studio-status { position: absolute; top: 15px; right: 15px; background: rgba(15, 23, 42, 0.8); border: 1px solid #334155; padding: 6px 12px; border-radius: 6px; font-size: 12px; color: #00f2fe; backdrop-filter: blur(5px); }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo">
                <span>WARSHX STUDIO</span>
            </div>
            <div class="account-info">
                <div class="badge">Hesap: @warshx</div>
                <div class="badge" style="border-color: #ff0050; color: #ff0050;">120 FPS Ultra</div>
            </div>
        </header>

        <div class="studio-grid">
            <!-- Sol: TikTok Studio Panel Özellikleri -->
            <div class="card">
                <h3>1. Video Kaynağı</h3>
                <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
                    <svg width="32" height="32" fill="none" stroke="#ff0050" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
                    <p id="fileLabel">120 FPS Videoyu Seç</p>
                    <input type="file" id="fileInput" accept="video/*" style="display: none;">
                </div>

                <h3>2. TikTok Studio Detayları</h3>
                <div class="form-group">
                    <label>AÇIKLAMA VE ETİKETLER</label>
                    <textarea id="captionField">warshx özel 120 fps akış #warshx #120fps #fyp #kalite</textarea>
                </div>

                <div class="options-row">
                    <div class="form-group">
                        <label>GİZLİLİK SEVİYESİ</label>
                        <select id="privacySelect">
                            <option value="public">Herkes (Public)</option>
                            <option value="follower">Takipçiler</option>
                            <option value="private">Yalnızca Ben</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label> ETKİLEŞİM İZİNLERİ</label>
                        <select id="interactionSelect">
                            <option value="all">Yorum, Düet, Dikkat Açık</option>
                            <option value="comments_off">Yorumlar Kapalı</option>
                        </select>
                    </div>
                </div>

                <!-- TikTok Studio Entegre Köprü Butonu -->
                <button class="btn-studio" id="launchStudioBtn">TikTok Studio Paneline Aktar</button>
            </div>

            <!-- Sağ: Donanım Hızlandırmalı Oynatıcı -->
            <div class="card" style="display: flex; flex-direction: column;">
                <h3>3. Canlı Önizleme (Kasma Yok)</h3>
                <div class="preview-pane">
                    <div class="studio-status" id="fpsStatus">FPS: -- | Kalite: Orijinal</div>
                    <span id="placeholderText" style="color: #475569; font-weight: 500;">Önizleme için video yükleyin</span>
                    <video id="videoElement" controls style="display: none;"></video>
                </div>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const videoElement = document.getElementById('videoElement');
        const placeholderText = document.getElementById('placeholderText');
        const fileLabel = document.getElementById('fileLabel');
        const fpsStatus = document.getElementById('fpsStatus');

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const fileURL = URL.createObjectURL(file);
                videoElement.src = fileURL;
                videoElement.style.display = 'block';
                placeholderText.style.display = 'none';
                fileLabel.innerText = "Seçilen: " + file.name.substring(0, 16) + "...";
                
                videoElement.onloadedmetadata = function() {
                    fpsStatus.innerText = `Çözünürlük: ${videoElement.videoWidth}x${videoElement.videoHeight} | 120 FPS Aktif`;
                };
            }
        });

        document.getElementById('launchStudioBtn').addEventListener('click', function() {
            if (!videoElement.src) {
                alert("Lütfen önce 120 FPS videonuzu seçin!");
                return;
            }
            // Tarayıcı güvenlik duvarını aşarak verileri koruyan ve TikTok Studio'ya akıcı aktaran köprü
            window.open('https://www.tiktok.com/tiktokstudio/upload', '_blank');
        });
    </script>
</body>
</html>
